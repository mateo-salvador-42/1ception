services:
  mariadb:
    build:
      context: requirements/mariadb
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: true
    restart: unless-stopped
    networks:
      - inception_network
    volumes:
        - db_data:/var/lib/mysql
    secrets:
        - db_password
        - db_root_password
  wordpress:
    build:
      context: requirements/wordpress
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: true
    depends_on:
      - mariadb
    restart: unless-stopped
    networks:
      - inception_network
    volumes:
      - wp_volume:/var/www/html
    secrets:
      - db_password
      - db_root_password
      - wp_password
  nginx:
    build:
      context: requirements/nginx
      dockerfile: Dockerfile
    depends_on:
      - wordpress
    restart: unless-stopped
    networks:
      - inception_network
    volumes:
      - wp_volume:/var/www/html
    ports:
      - 443:443

secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  wp_password:
    file: ../secrets/wp_password.txt

volumes:
  db_data:
  wp_volume:

networks:
  inception_network:
    driver: bridge
